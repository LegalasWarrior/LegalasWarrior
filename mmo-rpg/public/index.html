<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Текстовая RPG</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">Текстовая RPG</div>
      <div class="location">Локация: <span id="locName">—</span></div>
      <div class="actions" id="topActions"></div>
    </header>

    <main class="layout">
      <section class="left">
        <div class="panel">
          <h3>Журнал</h3>
          <div id="log" class="log"></div>
        </div>
        <div class="panel" id="combatPanel" style="display:none;">
          <h3>Бой</h3>
          <div id="combatInfo">—</div>
          <div class="row">
            <button id="btnAttack">Атаковать</button>
            <button id="btnFlee">Сбежать</button>
          </div>
        </div>
        <div class="panel" id="gatherPanel" style="display:none;">
          <h3>Добыча ресурсов</h3>
          <div class="row">
            <button data-gather="mine">Добыть руду</button>
            <button data-gather="chop">Рубить дерево</button>
            <button data-gather="fish">Ловить рыбу</button>
            <button data-gather="forage">Собирать травы</button>
            <button data-gather="hunt">Охотиться</button>
          </div>
        </div>
      </section>

      <section class="right">
        <div class="panel">
          <h3>Персонаж</h3>
          <div class="grid2">
            <div>Имя</div><div id="pName">—</div>
            <div>Уровень</div><div id="pLevel">—</div>
            <div>Опыт</div><div id="pXp">—</div>
            <div>Здоровье</div><div id="pHp">—</div>
            <div>Золото</div><div id="pGold">—</div>
          </div>
          <div class="row">
            <button id="btnHeal">Лечиться</button>
          </div>
        </div>

        <div class="panel">
          <h3>Снаряжение</h3>
          <div class="equip grid2" id="equip"></div>
        </div>

        <div class="tabs">
          <button class="tab active" data-tab="inv">Инвентарь</button>
          <button class="tab" data-tab="storage">Склад</button>
          <button class="tab" data-tab="trade">Торговля</button>
          <button class="tab" data-tab="craft">Крафт</button>
        </div>
        <div class="panel tabc active" id="tab-inv">
          <div id="inventory"></div>
        </div>
        <div class="panel tabc" id="tab-storage">
          <div id="storage"></div>
        </div>
        <div class="panel tabc" id="tab-trade">
          <div id="trade"></div>
        </div>
        <div class="panel tabc" id="tab-craft">
          <div id="craft"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="/client.js" type="module"></script>
</body>
</html>
